name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  python-style:
    name: Python Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff==0.15.21
      - name: Check Python lint
        run: ruff check --no-cache tools
      - name: Check Python formatting
        run: ruff format --no-cache --check tools

  checks:
    name: Catalog Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check changed-file whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            pull_request)
              git diff --check "${PR_BASE_SHA}...${PR_HEAD_SHA}"
              ;;
            push)
              if test "${BEFORE_SHA}" = "0000000000000000000000000000000000000000"; then
                git diff-tree --check --root -m -r "${CURRENT_SHA}"
              elif git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
                git diff --check "${BEFORE_SHA}" "${CURRENT_SHA}"
              else
                echo "previous revision is unavailable; checking the pushed revision"
                git diff-tree --check --root -m -r "${CURRENT_SHA}"
              fi
              ;;
            workflow_dispatch)
              git diff-tree --check --root -m -r "${CURRENT_SHA}"
              ;;
            *)
              echo "unsupported event for revision check" >&2
              exit 1
              ;;
          esac

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install validator dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Generate catalog
        run: python tools/generate_catalog.py

      - name: Validate generated headers
        run: python tools/generate_structs.py --validate

      - name: Run repository gate
        run: python tools/validate_repository.py --compiler clang++

      - name: Test generated header compilation
        run: python tools/test_generated_headers.py --compiler clang++

      - name: Test retail dispatch contract
        run: python tools/test_retail_zone_dispatch.py

      - name: Test 0x018D wire and consumer evidence
        run: python tools/test_018d_wire_layout.py

      - name: Test 0x0193 route evidence
        run: python tools/test_0193_route.py

      - name: Test achievement lifecycle evidence
        run: python tools/test_achievement_lifecycle.py

      - name: Check catalog regeneration
        run: git diff --exit-code

      - name: Check C++ formatting
        run: >-
          git ls-files -z -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh'
          '*.hpp' '*.hxx' |
          xargs -0 clang-format --dry-run --Werror
